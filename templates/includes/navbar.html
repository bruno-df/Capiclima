{# Barra de Navegação — Bootstrap 5 + Glassmorphism #}
{% load static %}
<nav class="navbar navbar-expand-lg navbar-cap fixed-top" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'ong:index' %}">
            {% if config_site and config_site.logo %}
                <img src="{{ config_site.logo.url }}" alt="Logo CapiClima">
            {% else %}
                <img src="{% static 'images/logo/CAPICLIMA - LOGO POSITIVO VERTICAL.png' %}" alt="Logo CapiClima">
            {% endif %}
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-lg-center gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
                       href="{% url 'ong:index' %}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'sobre' %}active{% endif %}"
                       href="{% url 'ong:sobre' %}">Sobre</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'atividades' %}active{% endif %}"
                       href="{% url 'ong:atividades' %}">Atividades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'oportunidades' %}active{% endif %}"
                       href="{% url 'ong:oportunidades' %}">Oportunidades</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'colaboradores' %}active{% endif %}"
                       href="{% url 'ong:colaboradores' %}">Equipe</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a href="{% url 'ong:apoie' %}" class="btn btn-apoie">
                        <i class="fas fa-heart"></i> Apoie
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
